services:
  # Next.js Web 应用
  - type: web
    name: rsxonhub-web
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rsxonhub-db
          property: connectionString
      - key: RSSHUB_BASE_URL
        sync: false
      - key: DIGEST_TIMEZONE
        value: Asia/Shanghai
      - key: DIGEST_GENERATE_AT
        value: "08:00"
      - key: DIGEST_PREPARE_AT
        value: "07:30"
      - key: DIGEST_TRIGGER_WINDOW_MINUTES
        value: "10"
      - key: DIGEST_SCAN_INTERVAL_MS
        value: "300000"
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_USERNAME
        sync: false
      - key: AUTH_PASSWORD
        sync: false

  # Worker 服务 (后台任务)
  - type: worker
    name: rsxonhub-worker
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rsxonhub-db
          property: connectionString
      - key: RSSHUB_BASE_URL
        sync: false
      - key: DIGEST_TIMEZONE
        value: Asia/Shanghai
      - key: DIGEST_GENERATE_AT
        value: "08:00"
      - key: DIGEST_PREPARE_AT
        value: "07:30"
      - key: DIGEST_TRIGGER_WINDOW_MINUTES
        value: "10"
      - key: DIGEST_SCAN_INTERVAL_MS
        value: "300000"
      - key: AUTH_SECRET
        sync: false

databases:
  # PostgreSQL 数据库
  - name: rsxonhub-db
    databaseName: rsxonhub
    user: rsxonhub
    region: oregon
    plan: starter
    ipAllowList: []

# 说明:
# 1. 在 Render Dashboard 中导入此文件
# 2. 配置环境变量 (AUTH_SECRET, AUTH_USERNAME, AUTH_PASSWORD, RSSHUB_BASE_URL)
# 3. Render 会自动创建 PostgreSQL 数据库
# 4. Worker 服务会持续运行处理 RSS 抓取和 AI 任务
